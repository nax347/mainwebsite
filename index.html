<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>truecatspr</title>
    <style>
        /* Grund-Einstellungen */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a1a; /* Dein gewünschter Hintergrund */
            font-family: "Liberation Sans", Arial, sans-serif; /* Deine gewünschte Font */
            color: #ffffff;
            min-height: 100vh;
        }

        /* Banner-Bereich ganz oben */
        .banner {
            width: 100%;
            display: flex;
            justify-content: center; /* Zentriert das gesamte Logo-Text-Paket horizontal */
            align-items: center;     /* Zentriert Logo und Text vertikal zueinander */
            padding: 40px 20px;      /* Abstand nach oben und unten */
        }

        .logo-wrapper {
            display: flex;
            align-items: center;
            gap: 20px; /* Abstand zwischen Logo und Text */
        }

        .logo-img {
            height: 120px; /* Größe des Logos - kannst du nach Belieben anpassen */
            width: auto;
        }

        .brand-name {
            font-size: 5rem; /* Schön groß wie gewünscht */
            font-weight: bold;
            letter-spacing: -2px; /* Wirkt bei großen Schriftzügen oft moderner */
            line-height: 1;
        }

        /* Farbspezifikation für den Markennamen */
        .truecats {
            color: #ffffff; /* Weiß */
        }

        .pr {
            color: #edaf42; /* Dein Gold-Ton */
        }

        /* Responsive Anpassung für kleinere Bildschirme */
        @media (max-width: 768px) {
            .brand-name {
                font-size: 3rem;
            }
            .logo-img {
                height: 80px;
            }
            .logo-wrapper {
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <header class="banner">
        <div class="logo-wrapper">
            <!-- Das Logo auf der linken Seite -->
            <img src="TCPRLogoTransparent.png" alt="TCPR Logo" class="logo-img">
            
            <!-- Der Name rechts daneben -->
            <div class="brand-name">
                <span class="truecats">truecats</span><span class="pr">pr</span>
            </div>
        </div>
    </header>

</body>
</html>
